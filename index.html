<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contrôle des présences</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="admin-trigger"></div>
  <header>
    <img src="logo-content-camp.png" alt="Logo" id="logo" onerror="this.style.display='none'">
    <h1>Accueil des participants</h1>
    <div id="date-display">Date : auto</div>
  </header>
  <main id="main-content">
    <div id="participants-list"></div>
    <div id="no-results" style="display: none;">
      <p>Aucun résultat</p>
      <button id="btn-add-search" class="btn-primary">Ajouter ce participant</button>
    </div>
  </main>
  <div id="search-container">
    <input type="text" id="searchInput" placeholder="Rechercher un nom...">
  </div>
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h2 id="profile-name">nom prénom</h2>
      <p><strong>Heure :</strong> <span id="profile-time"></span></p>
      <p><strong>Téléphone :</strong> <span id="profile-phone"></span></p>
      <p><strong>Email :</strong> <span id="profile-email"></span></p>
      <p><strong>Adresse :</strong> <span id="profile-address"></span></p>
      <div class="modal-actions">
        <button id="btn-validate" class="btn-primary">Valider la présence</button>
        <button id="btn-edit" class="btn-secondary">Modifier les infos</button>
        <button id="btn-close-profile" class="btn-text">Fermer</button>
      </div>
    </div>
  </div>
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h2>Modifier les informations</h2>
      <label>Prénom <input type="text" id="edit-prenom"></label>
      <label>Nom <input type="text" id="edit-nom"></label>
      <label>Heure <input type="text" id="edit-heure"></label>
      <label>Téléphone <input type="text" id="edit-phone"></label>
      <label>Email <input type="email" id="edit-email"></label>
      <label>Adresse <textarea id="edit-address"></textarea></label>
      <div class="modal-actions">
        <button id="btn-save-edit" class="btn-primary">Enregistrer</button>
        <button id="btn-cancel-edit" class="btn-text">Annuler</button>
      </div>
    </div>
  </div>
  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <h2>Menu administrateur</h2>
      <label>Forcer la date du shooting : 
        <select id="admin-date-select">
          <option value="auto">Automatique</option>
          <option value="27.10">27.10</option>
          <option value="29.10">29.10</option>
          <option value="31.10">31.10</option>
          <option value="04.11">04.11</option>
          <option value="07.11">07.11</option>
        </select>
      </label>
      <hr>
      <h3>Importer des données</h3>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
      <p class="help-text">Attention : l'import écrasera la liste actuelle</p>
      <hr>
      <h3>Exporter les données</h3>
      <button id="btn-export" class="btn-secondary">Télécharger la sauvegarde</button>
      <hr>
      <button id="btn-close-admin" class="btn-text">Fermer le menu</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
