<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b57d0">
  <title>Vérification des infos</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    /* Reset & Base Styles */
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b57d0 !important;
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    #admin-trigger {
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      z-index: 1000;
      background: transparent;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    #logo {
      max-width: 150px;
      margin-bottom: 10px;
    }
    #date-display {
      font-size: 1.1em;
      font-weight: bold;
      opacity: 0.9;
    }
    
    main {
      padding: 0 15px;
      padding-bottom: 180px; /* Space for detached search bar */
    }
    
    /* Participant Cards */
    .participant-card {
      background-color: rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .participant-card.valide {
      background-color: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.5);
      text-decoration: line-through;
    }
    .participant-info strong {
      display: block;
      font-size: 1.1em;
    }
    .participant-time {
      font-size: 0.9em;
      opacity: 0.8;
    }
    
    /* Search Bar & Add Button Area - Now detached from bottom */
    #search-container {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 15px;
      width: calc(100% - 30px);
      background-color: rgba(11, 87, 208, 0.98);
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 500;
    }
    
    #btn-add-search {
      background-color: #ffffff;
      color: #0b57d0;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-weight: bold;
      border-radius: 15px;
    }
    
    #searchInput {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: none;
      font-size: 16px;
      background-color: #ffffff;
      color: #333;
      box-sizing: border-box;
    }
    
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center; /* Changed from center to flex-start for horizontal iPad compatibility */
      align-items: flex-start;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 40px);
      box-sizing: border-box;
      overflow-y: auto; /* Allow modal container to scroll */
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background-color: #ffffff;
      color: #333;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 20px;
      margin: auto; /* Centers when flex-start is used, but respects top margin if too tall */
      max-height: 85vh; /* Keep it contained */
      overflow-y: auto; /* Scroll inside the content block */
    }
    .modal-content h2, .modal-content h3 {
      margin-top: 0;
      color: #0b57d0;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    
    /* Buttons */
    button {
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-primary { background-color: #0b57d0; color: #ffffff; }
    .btn-secondary { background-color: #e0e0e0; color: #333; }
    .btn-danger { background-color: #d32f2f; color: #ffffff; }
    .btn-warning { background-color: #ff9800; color: #ffffff; }
    .btn-text { background-color: transparent; color: #666; }
    
    /* Form Fields */
    label {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 0.9em;
    }
    label input, label select {
      margin-top: 5px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 16px;
    }
    
    /* Grid for Addresses */
    .address-grid-top {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 10px;
    }
    .address-grid-bottom {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
    }
    
    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }
    
    /* PIN Pad Styles */
    .pin-display {
      font-size: 2em;
      text-align: center;
      letter-spacing: 15px;
      margin-bottom: 20px;
      height: 40px;
      color: #0b57d0;
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 280px;
      margin: 0 auto;
      justify-items: center;
    }
    .pin-pad button {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      font-size: 1.5em;
      background-color: #f0f0f0;
      color: #333;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin-pad button.action-btn {
      font-size: 1em;
      background-color: transparent;
      border-radius: 10px;
      height: auto;
    }
    
    /* Toast Notification */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      border-radius: 25px;
      z-index: 3000;
      display: none;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="admin-trigger"></div>
  <div id="toast">Message</div>

  <header>
    <img src="logo-content-camp.png" alt="Logo" id="logo" onerror="this.style.display='none'">
    <div id="date-display">Shooting photo du XX.XX</div>
  </header>
  
  <main id="main-content">
    <div id="participants-list"></div>
  </main>
  
  <div id="search-container">
    <button id="btn-add-search" style="display: none;">Ajouter ce participant</button>
    <input type="text" id="searchInput" placeholder="Rechercher un nom...">
  </div>

  <!-- Modal : Profil -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h2 id="profile-name">nom prénom</h2>
      <p><strong>Heure :</strong> <span id="profile-time"></span></p>
      <p><strong>Téléphone :</strong> <span id="profile-phone"></span></p>
      <p><strong>Email :</strong> <span id="profile-email"></span></p>
      <p><strong>Adresse :</strong> <span id="profile-address"></span></p>
      <div class="modal-actions">
        <button id="btn-validate" class="btn-primary">Confirmer les informations</button>
        <button id="btn-edit" class="btn-secondary">Modifier les infos</button>
        <button class="btn-text close-modal" data-target="profile-modal">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal : Édition -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <h2>Modifier les informations</h2>
      <label>Prénom <input type="text" id="edit-prenom"></label>
      <label>Nom <input type="text" id="edit-nom"></label>
      <label>Heure <input type="time" id="edit-heure"></label>
      <label>Téléphone <input type="tel" id="edit-phone" placeholder="ex: 0791234567 ou +41791234567"></label>
      <label>Email <input type="email" id="edit-email"></label>
      
      <div class="address-grid-top">
        <label>Rue <input type="text" id="edit-rue"></label>
        <label>N° <input type="text" id="edit-numero" placeholder="ex: 12A"></label>
      </div>
      <div class="address-grid-bottom">
        <label>Code Postal <input type="text" inputmode="numeric" id="edit-cp" placeholder="ex: 1000"></label>
        <label>Localité <input type="text" id="edit-localite"></label>
      </div>

      <div class="modal-actions">
        <button id="btn-save-edit" class="btn-primary">Enregistrer</button>
        <button class="btn-text close-modal" data-target="edit-modal">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Modal : PIN Pad -->
  <div id="pin-modal" class="modal">
    <div class="modal-content" style="max-width: 320px;">
      <h2 style="text-align: center;">Code administrateur</h2>
      <div class="pin-display" id="pin-display"></div>
      <div class="pin-pad" id="pin-pad">
        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="4">4</button>
        <button data-val="5">5</button>
        <button data-val="6">6</button>
        <button data-val="7">7</button>
        <button data-val="8">8</button>
        <button data-val="9">9</button>
        <button class="action-btn close-modal" data-target="pin-modal">Annuler</button>
        <button data-val="0">0</button>
        <button class="action-btn" id="btn-pin-back">⌫</button>
      </div>
    </div>
  </div>

  <!-- Modal : Admin -->
  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <h2>Menu administrateur</h2>
      
      <label>Date du shooting : 
        <select id="admin-date-select">
          <option value="27.10">27.10</option>
          <option value="29.10">29.10</option>
          <option value="31.10">31.10</option>
          <option value="04.11">04.11</option>
          <option value="07.11">07.11</option>
        </select>
      </label>
      <hr>
      
      <h3>Importer Liste Initiale (Excel)</h3>
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" style="width: 100%;">
      <hr>
      
      <h3>Export & Sauvegarde</h3>
      <button id="btn-export-excel" class="btn-primary" style="margin-bottom: 10px;">Exporter le tableau final (Excel)</button>
      <button id="btn-export-json" class="btn-secondary" style="margin-bottom: 10px;">Sauvegarde de secours (.json)</button>
      
      <label>Restaurer depuis un fichier .json :
        <input type="file" id="restoreInput" accept=".json" style="width: 100%;">
      </label>
      <hr>

      <h3>Zone de danger</h3>
      <button id="btn-reset-day" class="btn-warning" style="margin-bottom: 10px;">Réinitialiser la journée sélectionnée</button>
      <button id="btn-reset-all" class="btn-danger">Réinitialiser TOUTES les données</button>
      <hr>

      <button class="btn-text close-modal" data-target="admin-modal">Fermer le menu</button>
    </div>
  </div>

  <script>
    const VALID_DATES = ["27.10", "29.10", "31.10", "04.11", "07.11"];
    let participants = [];
    let activeDate = VALID_DATES[0];
    let currentParticipantId = null;
    let currentPin = "";

    window.onload = function() {
      initDate();
      loadData();
      renderList();
      setupModals();
      setupPinPad();
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function initDate() {
      const d = new Date();
      const todayStr = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
      if (VALID_DATES.includes(todayStr)) {
        activeDate = todayStr;
      }
    }

    function loadData() {
      const saved = localStorage.getItem('shooting_participants');
      if (saved) participants = JSON.parse(saved);
      
      const savedDate = localStorage.getItem('shooting_date');
      if (savedDate && VALID_DATES.includes(savedDate)) {
        activeDate = savedDate;
      }
      document.getElementById('admin-date-select').value = activeDate;
    }

    function saveData() {
      localStorage.setItem('shooting_participants', JSON.stringify(participants));
    }

    function parseTimeForSort(t) {
      if (!t) return "23:59";
      // Remplacer 'h' ou 'H' par ':' (ex: "9h15" -> "9:15")
      let s = t.toString().replace(/h/i, ':').trim();
      let parts = s.split(':');
      if (parts.length >= 2) {
        let hr = parts[0].padStart(2, '0');
        let min = parts[1].padStart(2, '0');
        return `${hr}:${min}`;
      }
      return "23:59";
    }

    function renderList(searchQuery = "") {
      const listContainer = document.getElementById('participants-list');
      const btnAdd = document.getElementById('btn-add-search');
      listContainer.innerHTML = '';
      
      document.getElementById('date-display').innerText = "Shooting photo du " + activeDate;

      let filtered = participants.filter(p => p.Date === activeDate || !p.Date);
      let exactMatchFound = false;

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(p => {
          const match = (p.Nom && p.Nom.toLowerCase().includes(q)) || (p.Prenom && p.Prenom.toLowerCase().includes(q));
          if (match) exactMatchFound = true;
          return match;
        });
      }

      // Tri chronologique rigoureux, et validés à la fin
      filtered.sort((a, b) => {
        if (a.valide !== b.valide) return a.valide ? 1 : -1;
        let timeA = parseTimeForSort(a.Heure);
        let timeB = parseTimeForSort(b.Heure);
        return timeA.localeCompare(timeB);
      });

      btnAdd.style.display = (searchQuery !== "" && !exactMatchFound) ? 'block' : 'none';

      filtered.forEach(p => {
        const div = document.createElement('div');
        div.className = 'participant-card' + (p.valide ? ' valide' : '');
        div.onclick = () => openProfile(p.id);
        div.innerHTML = `
          <div class="participant-info">
            <strong>${p.Prenom || ''} ${p.Nom || ''}</strong>
            <span class="participant-time">${p.Heure || 'Heure non définie'}</span>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    // Modal Handling
    function setupModals() {
      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.onclick = (e) => {
          const targetId = e.target.getAttribute('data-target');
          document.getElementById(targetId).classList.remove('active');
          if(targetId === 'edit-modal') openProfile(currentParticipantId);
        };
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => renderList(e.target.value));

    document.getElementById('btn-add-search').addEventListener('click', function() {
      const query = document.getElementById('searchInput').value.trim();
      let nom = "", prenom = query;
      if (query.includes(' ')) {
        const parts = query.split(' ');
        nom = parts.pop();
        prenom = parts.join(' ');
      }
      
      const newP = {
        id: Date.now().toString(),
        Prenom: prenom, Nom: nom, Date: activeDate, Heure: "",
        Telephone: "", Mail: "", Rue: "", Numero: "", CP: "", Localite: "",
        valide: false
      };
      
      participants.push(newP);
      saveData();
      document.getElementById('searchInput').value = "";
      renderList();
      openProfile(newP.id);
    });

    // Profils
    function openProfile(id) {
      currentParticipantId = id;
      const p = participants.find(x => x.id === id);
      if (!p) return;
      
      document.getElementById('profile-name').innerText = `${p.Prenom || ''} ${p.Nom || ''}`;
      document.getElementById('profile-time').innerText = p.Heure || '-';
      document.getElementById('profile-phone').innerText = p.Telephone || '-';
      document.getElementById('profile-email').innerText = p.Mail || '-';
      
      const fullAddress = [p.Rue, p.Numero, p.CP, p.Localite].filter(Boolean).join(' ');
      document.getElementById('profile-address').innerText = fullAddress || (p.Adresse || '-');
      
      const btnVal = document.getElementById('btn-validate');
      btnVal.innerText = p.valide ? "Annuler la confirmation" : "Confirmer les informations";
      btnVal.style.backgroundColor = p.valide ? "#d32f2f" : "#0b57d0";
      
      document.getElementById('profile-modal').classList.add('active');
    }

    document.getElementById('btn-validate').onclick = () => {
      const p = participants.find(x => x.id === currentParticipantId);
      if (p) {
        p.valide = !p.valide;
        saveData();
        renderList(document.getElementById('searchInput').value);
      }
      document.getElementById('profile-modal').classList.remove('active');
    };

    document.getElementById('btn-edit').onclick = () => {
      const p = participants.find(x => x.id === currentParticipantId);
      if (!p) return;
      
      document.getElementById('edit-prenom').value = p.Prenom || '';
      document.getElementById('edit-nom').value = p.Nom || '';
      
      // Essayer de formater l'heure pour l'input type="time"
      let formattedTime = p.Heure || '';
      if (formattedTime) {
          let timeSortStr = parseTimeForSort(formattedTime);
          if(timeSortStr !== "23:59") formattedTime = timeSortStr;
      }
      document.getElementById('edit-heure').value = formattedTime;
      
      document.getElementById('edit-phone').value = p.Telephone || '';
      document.getElementById('edit-email').value = p.Mail || '';
      document.getElementById('edit-rue').value = p.Rue || '';
      document.getElementById('edit-numero').value = p.Numero || '';
      document.getElementById('edit-cp').value = p.CP || '';
      document.getElementById('edit-localite').value = p.Localite || '';
      
      document.getElementById('profile-modal').classList.remove('active');
      document.getElementById('edit-modal').classList.add('active');
    };

    document.getElementById('btn-save-edit').onclick = () => {
      let errs = [];
      
      const phone = document.getElementById('edit-phone').value.replace(/\s/g, '');
      if (phone && !/^(\+\d{2}\d{9}|\d{10})$/.test(phone)) {
        errs.push("Le téléphone doit contenir 10 chiffres (ex: 0791234567) ou +XX suivi de 9 chiffres.");
      }
      
      const email = document.getElementById('edit-email').value;
      if (email && !email.includes('@')) {
        errs.push("L'adresse email doit contenir un symbole @.");
      }

      const numero = document.getElementById('edit-numero').value.trim();
      if (numero && !/^\d{1,3}[a-zA-Z]?$/.test(numero)) {
        errs.push("Le numéro de rue doit contenir entre 1 et 3 chiffres, avec éventuellement une lettre (ex: 12, 12A).");
      }

      const cp = document.getElementById('edit-cp').value.trim();
      if (cp && !/^\d{4}$/.test(cp)) {
        errs.push("Le Code Postal doit contenir exactement 4 chiffres.");
      }
      
      if (errs.length > 0) {
        alert(errs.join('\n\n'));
        return;
      }

      const p = participants.find(x => x.id === currentParticipantId);
      if (p) {
        p.Prenom = document.getElementById('edit-prenom').value;
        p.Nom = document.getElementById('edit-nom').value;
        p.Heure = document.getElementById('edit-heure').value;
        p.Telephone = document.getElementById('edit-phone').value;
        p.Mail = document.getElementById('edit-email').value;
        p.Rue = document.getElementById('edit-rue').value;
        p.Numero = document.getElementById('edit-numero').value;
        p.CP = document.getElementById('edit-cp').value;
        p.Localite = document.getElementById('edit-localite').value;
        p.Adresse = "";
        saveData();
        renderList(document.getElementById('searchInput').value);
      }
      document.getElementById('edit-modal').classList.remove('active');
      openProfile(currentParticipantId);
    };

    // Admin & PIN Pad
    let tapCount = 0;
    let tapTimer;
    document.getElementById('admin-trigger').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 5) {
        tapCount = 0;
        currentPin = "";
        updatePinDisplay();
        document.getElementById('pin-modal').classList.add('active');
      }
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
    });

    function setupPinPad() {
      document.querySelectorAll('#pin-pad button[data-val]').forEach(btn => {
        btn.onclick = () => {
          if (currentPin.length < 4) {
            currentPin += btn.getAttribute('data-val');
            updatePinDisplay();
            if (currentPin.length === 4) checkPin();
          }
        };
      });
      document.getElementById('btn-pin-back').onclick = () => {
        currentPin = currentPin.slice(0, -1);
        updatePinDisplay();
      };
    }

    function updatePinDisplay() {
      const chars = currentPin.padEnd(4, '•').split('');
      document.getElementById('pin-display').innerText = chars.join(' ');
    }

    function checkPin() {
      if (currentPin === "1848") {
        setTimeout(() => {
          document.getElementById('pin-modal').classList.remove('active');
          document.getElementById('admin-modal').classList.add('active');
        }, 200);
      } else {
        setTimeout(() => {
          alert("Code incorrect");
          currentPin = "";
          updatePinDisplay();
        }, 100);
      }
    }

    document.getElementById('admin-date-select').onchange = (e) => {
      activeDate = e.target.value;
      localStorage.setItem('shooting_date', activeDate);
      renderList();
      showToast("Date changée pour le " + activeDate);
    };

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(worksheet);
        
        participants = json.map((row, index) => ({
          id: Date.now().toString() + "-" + index,
          Prenom: row.Prenom || row.Prénom || "",
          Nom: row.Nom || "",
          Date: row.Date || row.Jour || activeDate,
          Heure: row.Heure || row.Horaire || "",
          Telephone: row.Telephone || row.Téléphone || row.Tel || "",
          Mail: row.Mail || row.Email || "",
          Rue: row.Rue || row.Adresse || "", 
          Numero: row.Numero || row["N°"] || "", 
          CP: row.CP || row.NPA || row["Code Postal"] || "", 
          Localite: row.Localite || row.Localité || row.Ville || "",
          Adresse: row.Adresse_postale || "",
          valide: false
        }));
        
        saveData();
        renderList();
        showToast("Import réussi : " + participants.length + " personnes");
        document.getElementById('fileInput').value = "";
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('restoreInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data)) {
            participants = data;
            saveData();
            renderList();
            showToast("Restauration de la sauvegarde réussie !");
          } else {
            alert("Le fichier JSON n'est pas au bon format.");
          }
        } catch(err) {
          alert("Erreur lors de la lecture du fichier de sauvegarde.");
        }
        document.getElementById('restoreInput').value = "";
      };
      reader.readAsText(file);
    });

    // Export JSON Backup
    document.getElementById('btn-export-json').onclick = () => {
      const dataStr = JSON.stringify(participants, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      triggerDownload(blob, "sauvegarde_secours_" + activeDate + ".json");
    };

    // Export Excel (.xlsx) Final
    document.getElementById('btn-export-excel').onclick = () => {
      const exportData = participants.map(p => ({
        "Prénom": p.Prenom,
        "Nom": p.Nom,
        "Date": p.Date,
        "Heure": p.Heure,
        "Téléphone": p.Telephone,
        "Email": p.Mail,
        "Rue": p.Rue,
        "N°": p.Numero,
        "NPA": p.CP,
        "Localité": p.Localite,
        "Présence Confirmée": p.valide ? "OUI" : "NON"
      }));
      
      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Participants");
      XLSX.writeFile(wb, "export_shooting_" + activeDate + ".xlsx");
      showToast("Téléchargement Excel lancé !");
    };

    function triggerDownload(blob, filename) {
      if (window.navigator && window.navigator.msSaveOrOpenBlob) {
          window.navigator.msSaveOrOpenBlob(blob, filename);
      } else {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
      }
      showToast("Téléchargement lancé !");
    }

    // Reset Day
    document.getElementById('btn-reset-day').onclick = () => {
      if(confirm(`Voulez-vous effacer uniquement les données du ${activeDate} ? N'oubliez pas d'exporter une sauvegarde avant !`)) {
        participants = participants.filter(p => p.Date !== activeDate);
        saveData();
        renderList();
        showToast(`Données du ${activeDate} réinitialisées.`);
      }
    };

    // Reset All
    document.getElementById('btn-reset-all').onclick = () => {
      if(confirm("ATTENTION : Voulez-vous vraiment effacer TOUTES les données de cet appareil ?")) {
        if(confirm("Êtes-vous absolument sûr ? Cette action est irréversible.")) {
          participants = [];
          saveData();
          renderList();
          showToast("Toutes les données ont été réinitialisées.");
        }
      }
    };
  </script>
</body>
</html>
